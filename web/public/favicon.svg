<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#dc3c1e" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="disc" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d9351f"/>
      <stop offset="100%" stop-color="#fdc68a"/>
    </linearGradient>
    <linearGradient id="topRim" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btmShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="75%" stop-color="#781400" stop-opacity="0"/>
      <stop offset="100%" stop-color="#781400" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="48" r="38" fill="url(#disc)" filter="url(#shadow)"/>
  <circle cx="50" cy="48" r="38" fill="url(#topRim)"/>
  <circle cx="50" cy="48" r="38" fill="url(#btmShadow)"/>
</svg>